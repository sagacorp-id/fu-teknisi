:root{
  /* tata letak: header merek + tab pil; Buat FU = kotak ketik kiri, pesan WhatsApp kanan; warna mengikuti biru logo Inter */
  --bg:#eef2f9;--surface:#ffffff;--sunken:#f3f6fb;--ink:#152043;--muted:#5d6a8a;--line:#d6deee;
  --accent:#2b4a9e;--accent-2:#1b7fd0;--accent-ink:#ffffff;--accent-soft:#e2eafb;
  --warn:#8a5200;--warn-soft:#fbefd3;--bad:#b3261e;--bad-soft:#fce6e3;--ok:#17734a;--ok-soft:#dcf3e6;
  --shadow:0 1px 2px rgba(21,32,67,.06),0 6px 20px rgba(21,32,67,.06);
  --f-body:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:14px;
  --veil:rgba(232,238,250,.5);--glass:rgba(255,255,255,.74);--glass-line:rgba(255,255,255,.75);--field:rgba(255,255,255,.6);
}
@media (prefers-color-scheme:dark){

    --bg:#0c1122;--surface:#151c33;--sunken:#0f1529;--ink:#e6ebfa;--muted:#96a2c4;--line:#27314f;
    --accent:#86a8ff;--accent-2:#5cc0ff;--accent-ink:#0b1430;--accent-soft:#1c2850;
    --veil:rgba(8,12,28,.6);--glass:rgba(20,27,52,.7);--glass-line:rgba(134,168,255,.16);--field:rgba(10,15,32,.5);--warn:#f1b65c;--warn-soft:#3a2c10;--bad:#f39088;--bad-soft:#3d1a17;--ok:#6fd49b;--ok-soft:#12301f;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0c1122;--surface:#151c33;--sunken:#0f1529;--ink:#e6ebfa;--muted:#96a2c4;--line:#27314f;
  --accent:#86a8ff;--accent-2:#5cc0ff;--accent-ink:#0b1430;--accent-soft:#1c2850;

  color-scheme:dark;
}

body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);-webkit-text-size-adjust:100%;transition:background-color .25s,color .25s}
h1,h2,h3{font-weight:700;margin:0;text-wrap:balance;letter-spacing:-.01em}
h2{font-size:17px}
h3{font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600}
p{margin:0}
a{color:var(--accent)}
.muted{color:var(--muted)}.small{font-size:13px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--accent-2);outline-offset:2px}
code{font:12.5px var(--f-mono);background:var(--sunken);border:1px solid var(--line);padding:1px 6px;border-radius:6px;white-space:nowrap}

.top{position:sticky;top:0;z-index:20;background:var(--glass);-webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4);border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;align-items:center;gap:8px 20px;padding:9px 20px;transition:background-color .25s}
.top::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:linear-gradient(90deg,var(--accent),var(--accent-2) 55%,transparent)}
.brand{display:flex;align-items:center;gap:11px}
.brand img{width:40px;height:40px;display:block;border-radius:9px}
.brand b{display:block;font-size:15.5px;font-weight:700;line-height:1.2}
.brand small{color:var(--accent);font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase}
.app{display:flex;align-items:center;gap:8px;padding-left:18px;border-left:1px solid var(--line);font-weight:700;font-size:14px}
.app-mark{width:34px;height:34px;display:block;border-radius:9px;transition:transform .2s}
.app:hover .app-mark{transform:rotate(-8deg) scale(1.06)}
.tabs{display:flex;gap:2px;overflow-x:auto;margin-left:auto;max-width:100%;background:var(--sunken);padding:4px;border-radius:12px}
.tabs a{white-space:nowrap;text-decoration:none;color:var(--muted);font-weight:600;font-size:13px;padding:8px 10px;border-radius:9px;transition:background-color .2s,color .2s,transform .12s}
.tabs a:hover{color:var(--ink)}
.tabs a:active{transform:scale(.96)}
.tabs a[aria-current="page"]{background:var(--surface);color:var(--accent);box-shadow:var(--shadow)}
.theme{display:flex;background:var(--sunken);padding:4px;border-radius:12px;gap:2px}
.theme button{border:0;background:transparent;color:var(--muted);font:600 12.5px var(--f-body);padding:7px 10px;border-radius:9px;cursor:pointer;transition:background-color .2s,color .2s,transform .12s}
.theme button:active{transform:scale(.94)}
.theme button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}

main{max-width:1280px;margin:0 auto;padding:20px;display:flex;flex-direction:column;gap:16px}
main.enter>*{animation:naik .32s cubic-bezier(.2,.7,.2,1) both}
main.enter>*:nth-child(2){animation-delay:.05s}
main.enter .stack>*:nth-child(2){animation:naik .32s .06s cubic-bezier(.2,.7,.2,1) both}
@keyframes naik{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes muncul{from{opacity:0;transform:scale(.98)}to{opacity:1;transform:none}}
@keyframes denyut{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--ok) 55%,transparent)}100%{box-shadow:0 0 0 14px transparent}}
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
.stack{display:flex;flex-direction:column;gap:16px;min-width:0}
.sticky{position:sticky;top:78px;max-height:calc(100vh - 94px);overflow-y:auto}
@media (max-width:980px){.cols{grid-template-columns:minmax(0,1fr)}.sticky{position:static;max-height:none;overflow:visible}}

.net.off{background:var(--bad-soft);color:var(--bad)}.net.wait{background:var(--warn-soft);color:var(--warn)}
.tabs a{position:relative}
.badge{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 5px;margin-left:6px;border-radius:99px;background:var(--bad);color:#fff;font:700 10.5px/1 var(--f-body);vertical-align:1px;animation:kedip .4s ease-out}
.telat{color:var(--bad);font-weight:600}
.lapor{border-top:1px dashed var(--line);padding-top:10px;display:flex;flex-direction:column;gap:8px;animation:naik .2s ease-out}
tr.jumlah td{border-top:2px solid var(--line)}
.login-wrap{background:rgba(8,12,28,.55);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.login{width:min(420px,100%)}
.login.goyang{animation:goyang .4s}
.who-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.who{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 8px;border:1.5px solid var(--line);border-radius:14px;background:var(--sunken);color:var(--ink);font:600 13.5px var(--f-body);cursor:pointer;transition:border-color .2s,transform .12s,background .2s}
.who:hover{border-color:var(--accent-2)}.who:active{transform:scale(.96)}
.who[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.av{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:var(--accent-ink);font:700 14px var(--f-mono)}

/* ---- v1.2 ---- */
.rstat{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
@media (max-width:780px){.rstat{grid-template-columns:repeat(2,1fr)}}
.stc{position:relative;overflow:hidden;background:var(--glass,var(--surface));-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:14px;padding:12px 14px 12px 18px;display:flex;flex-direction:column;gap:1px;animation:naik .3s ease-out both}
.stc::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--accent)}
.stc.ok::before{background:var(--ok)}.stc.warn::before{background:var(--warn)}.stc.bad::before{background:var(--bad)}
.stc span{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.stc strong{font-size:24px;line-height:1.15;color:var(--ink)}.stc small{font-size:11.5px;color:var(--muted)}
@media (min-width:980px){.cols.riw{grid-template-columns:minmax(0,1.25fr) minmax(0,1fr)}}
.riw-filter{display:flex;flex-direction:column;gap:8px}
.rw-list{display:flex;flex-direction:column;gap:8px}
.rw-hari{font:700 11px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:8px 2px 0;display:flex;align-items:center;gap:10px}
.rw-hari::after{content:"";flex:1;height:1px;background:var(--line)}
.rw{border:1px solid var(--line);border-left:3px solid var(--warn);border-radius:12px;padding:10px 12px;background:var(--field);display:flex;flex-direction:column;gap:6px;transition:border-color .2s,transform .15s}
.rw:hover{transform:translateY(-1px)}.rw.sent{border-left-color:var(--ok)}
.rw-top{display:flex;align-items:center;gap:10px}
.rw-nm{flex:1;min-width:0;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}.rw-nm b{font-size:14.5px}.rw-nm span{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis}
.rw-tot{font-size:13px;font-weight:600;white-space:nowrap}
.rw-meta{display:flex;gap:6px 12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}.rw-fu{color:var(--accent);font-weight:600}
.rw-btn{display:flex;gap:6px;flex-wrap:wrap;align-items:flex-start}
.mini{font:600 12px var(--f-body);padding:5px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;transition:border-color .15s,background .15s,color .15s,transform .1s}
.mini:hover{border-color:var(--accent-2);color:var(--accent)}.mini:active{transform:scale(.95)}
.mini.ok:hover{border-color:var(--ok);color:var(--ok)}.mini.del{color:var(--bad)}.mini.del:hover{border-color:var(--bad);color:var(--bad)}
.mini.armed{background:var(--bad);border-color:var(--bad);color:#fff;animation:goyang .35s}.mini.armed:hover{color:#fff}
.rw-det{flex:1 1 100%}.rw-det summary{cursor:pointer;font-size:12px;color:var(--accent);font-weight:600;width:max-content}
.rw-det pre{font:12.5px/1.5 var(--f-mono);white-space:pre-wrap;word-break:break-word;background:var(--sunken);padding:10px;border-radius:9px;margin:6px 0 0;max-height:320px;overflow:auto;text-transform:none}
.wm-ver{display:inline-flex;align-items:center;gap:6px}
.ver-pill{font:700 11px var(--f-mono);padding:2px 10px;border-radius:99px;border:0;background:var(--accent-soft);color:var(--accent);cursor:pointer;transition:background .2s,color .2s,transform .12s}
.ver-pill:hover{background:var(--accent);color:var(--accent-ink)}.ver-pill:active{transform:scale(.94)}
.clm{text-align:left}.clm-top{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}.clm-top svg{border-radius:16px;margin-bottom:6px}
.cl{border-left:3px solid var(--accent-2);padding:2px 0 2px 14px;margin:0 0 14px}
.cl h4{margin:0 0 6px;font-size:14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;text-transform:none}
.cl ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:5px}
.cl li{font-size:13px;display:flex;gap:8px;align-items:flex-start;text-transform:none}
.clchip{font:700 10.5px var(--f-body);padding:2px 8px;border-radius:99px;white-space:nowrap;flex:none;margin-top:1px}
.clchip.new{background:var(--accent-soft);color:var(--accent)}.clchip.fix{background:var(--ok-soft);color:var(--ok)}.clchip.up{background:color-mix(in srgb,#7c3aed 15%,transparent);color:color-mix(in srgb,#7c3aed 62%,var(--ink))}

.cl-baru{font:700 10.5px var(--f-body);background:var(--bad);color:#fff;padding:2px 8px;border-radius:99px}
.cl-lama{border:1px solid var(--line);border-radius:12px;padding:8px 12px;background:var(--sunken)}
.cl-lama>summary{text-transform:none;cursor:pointer;font-weight:700;font-size:13px;color:var(--accent)}.cl-lama .cl{margin-top:12px}
.pv{position:fixed;left:12px;bottom:12px;z-index:40;font:700 11px var(--f-mono);background:#f59e0b;color:#1f1300;padding:6px 12px;border-radius:99px;box-shadow:0 6px 18px rgba(0,0,0,.25);letter-spacing:.04em}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
@media (max-width:560px){main{padding:14px}.top{padding:9px 14px}.card{padding:14px}.trow{grid-template-columns:38px minmax(0,1fr)}.trow .hg{grid-column:2;text-align:left}}
</style>
</head>

{id:'INUL',grup:'laptop',nama:'Install ulang',contoh:'kak budi, axioo neon\nkeluhan bluescreen',
teks:'Selamat {SALAM} {SAPA}.\nKami dari Teknisi Internasional Komputer Karanganyar. 😊🙏\n\nKami ingin mengonfirmasi terkait service *{UNIT}* dengan kendala *{KELUHAN|Bluescreen}*.\nSebagai langkah awal, kami sarankan *Install Ulang Windows* terlebih dahulu agar sistem kembali fresh.\n\n*Rincian :*\n- Biaya : *_{BIAYARP|Rp 85.000}_*\n- Garansi service {GARANSI|2 minggu}\n- Estimasi pengerjaan {ESTIMASI|1x24 jam}\n\n*Catatan.*\n- Untuk data bisa di backup kecuali data yang error, data yang tersambung di cloud *_( Onedrive, Googledrive, dll )_* dan data dalam aplikasi seperti akun untuk login dan history browser dll tidak bisa dibackup namun bisa login ulang dari awal.\n- Aplikasi dan game sebelumnya akan terhapus. Namun dari kami akan menginstalkan aplikasi standar, dan apabila ada aplikasi tertentu yang diinginkan, silakan diinformasikan selama tersedia.\n- Jika laptop menggunakan *_Microsoft Office original_*, mohon disiapkan akses akun Microsoft-nya untuk login dan aktivasi kembali saat pengambilan, *_mohon tidak mengirimkan password lewat WhatsApp_*. Apabila tidak tersedia, dapat kami bantu instal *_Office non-original_* sesuai kebutuhan.\n- Pengecekan komponen lain baru dapat dilakukan setelah Windows dapat masuk dengan normal.\n{CATATAN}\n\nKira-kira bagaimana ya {sp}, mohon konfirmasinya 😊🙏\nTerima kasih.'},

{id:'CLEANING',grup:'laptop',nama:'Cleaning repasta',contoh:'kak budi, lenovo legion 5\nkeluhan panas / kipas bising\nbiaya 150-250',
teks:'Selamat {SALAM} {SAPA}.\nKami dari Internasional Komputer Karanganyar dengan Teknisi {TEKNISI}.\n\nBaik {sp}, untuk service *{UNIT}* yg anda masukkan dgn keterangan *{KELUHAN|Panas / Kipas Bising}*.\nKami beri solusi awal dicoba cleaning repasta dulu {sp}.\n\nSebelum kami lanjutkan proses service, kami sampaikan penjelasan dan ketentuan untuk *_cleaning & repasta_* ya {Sp}, supaya tidak terjadi kesalahpahaman ke depannya 😊🙏\n\nProses ini *hanya mencakup perawatan internal*, yaitu :\n- Pembersihan debu pada fan dan heatsink\n- Penggantian *thermal paste* pada chip processor _(CPU)_ dan VGA _(GPU)_\n- Penggantian *thermal pad* apabila diperlukan _(jika kondisi sudah kering atau getas)_\n\nService ini *tidak mempengaruhi* naik atau turunnya FPS, error aplikasi/game, system error, bluescreen, atau kendala software lainnya karena bisa dipengaruhi faktor lain _( driver, OS, setting windows, usia hardware, dsb )._\n\nDengan melakukan _service cleaning & repasta_, berarti *memahami dan menyetujui* bahwa layanan ini bertujuan untuk *menjaga suhu dan performa termal perangkat* , bukan untuk memperbaiki masalah software atau meningkatkan FPS secara langsung.\n\n*INFORMASI*\n💰 Biaya : *_{BIAYA|150-250rb}_* ( tergantung seri )\n⏱ Pengerjaan : {ESTIMASI|1×24 jam} ( jika lancar )\n🛡 Garansi service :\n- Garansi service {GARANSI|2 minggu}, berlaku untuk hasil pengerjaan cleaning & repasta.\n- Garansi tidak mencakup kerusakan atau kendala di luar ruang lingkup service tersebut.\n⚠️ Untuk kondisi setelah proses *_cleaning repasta_* akan kami infokan setelah ACC dikerjakan dan pengecekan di system windowsnya.\n{CATATAN}\n\nMohon konfirmasi persetujuannya ya {Sp} sebelum kami lanjutkan. Terima kasih 🙏'},

{id:'CLEANING_PENDEK',grup:'laptop',nama:'Cleaning repasta (pendek)',contoh:'kak budi, lenovo legion 5\nkeluhan panas\nbiaya 150-250',
teks:'Selamat {SALAM} {SAPA}.\nKami dari Internasional Komputer Karanganyar dengan Teknisi {TEKNISI}.\n\nBaik {sp}, untuk service *{UNIT}* yg anda masukkan dgn keterangan *{KELUHAN|Panas / Kipas Bising}*.\nKami beri solusi awal dicoba cleaning repasta dulu {sp}.\n\nSebelum kami lanjutkan proses service, kami sampaikan penjelasan dan ketentuan untuk *_cleaning & repasta_* ya {Sp}, supaya tidak terjadi kesalahpahaman ke depannya 😊🙏\n\n*Service Cleaning & Repasta* meliputi :\n- Pembersihan debu pada fan dan heatsink.\n- Penggantian *thermal paste* CPU & GPU.\n- Penggantian *thermal pad* jika diperlukan.\n\n*Catatan.*\n- Service ini bertujuan menjaga suhu dan performa termal perangkat.\n- *Tidak* memperbaiki FPS, error aplikasi/game, system error, bluescreen, maupun kendala software lainnya karena dapat dipengaruhi faktor lain (driver, OS, pengaturan Windows, usia hardware, dll).\n{CATATAN}\n\nDengan melanjutkan service ini, berarti *memahami dan menyetujui* ketentuan di atas.\n\n*INFORMASI*\n💰 Biaya : *_{BIAYA|150-250rb}_* ( tergantung seri )\n⏱ Pengerjaan : {ESTIMASI|1×24 jam} ( jika lancar )\n🛡 Garansi service :\n- Garansi service {GARANSI|2 minggu}, berlaku untuk hasil pengerjaan cleaning & repasta.\n- Garansi tidak mencakup kerusakan atau kendala di luar ruang lingkup service tersebut.\n⚠️ Untuk kondisi setelah proses *_cleaning repasta_* akan kami infokan setelah ACC dikerjakan dan pengecekan di system windowsnya.\n\nMohon konfirmasi persetujuannya ya {Sp} sebelum kami lanjutkan.\nTerima kasih 🙏'},

{id:'PRINTER_SC',grup:'printer',nama:'Printer lempar SC',contoh:'bu sari, brother hl-l2360\nkeluhan muncul error code',
teks:'Selamat {SALAM} {SAPA}.\nKami dari Teknisi Internasional Komputer Karanganyar.\n\nUntuk service printer *{UNIT}* yg anda masukkan dgn keterangan *{KELUHAN|Tdk Bisa Print / Muncul Error Code}* setelah kami cek ini untuk kendalanya ada beberapa kemungkinan part yg trouble.\n\nKarna seri ini termasuk printer yg jarang atau tidak umum seperti biasanya.\n\nLalu untuk solusinya dari kami ada 2 opsi, sbb :\n1. Kami bantu untuk dikirim ke SC langsung supaya langsung dicek\'kan disana, terkait biayanya akan kami infokan setelah mendapat info dari SC.\n2. Langsung dibawa ke SC secara pribadi / mandiri, supaya komunikasinya langsung 2 arah.\n\n*Catatan.*\n- Jika memilih opsi 1, estimasi waktunya jauh lebih lama bisa *{ESTIMASI|2-3 mingguan}* dan semisal sudah dikirim ke SC sudah ketemu troublenya lalu mau cancel akan ada biaya cek dari SC ( nominal tergantung dari SC dan ditambah biaya ongkir 50rb ).\n- Untuk kondisi hasil cetaknya kami belum bisa cek\n{CATATAN}\n\n_*SC = Service Center*_\n\nKira-kira bagaimana, mohon konfirmasinya ya {sp}?\n'+TUTUP},

{id:'PROJECTOR',grup:'printer',nama:'Service proyektor',contoh:'pak budi, epson eb-x500\nkeluhan lampu indikator merah\nbagian lampunya dan sensor temperaturnya\nbiaya 400-650',

{id:'PART_INDEN',grup:'status',nama:'Part kosong, inden lama',contoh:'kak budi, acer a314-22\ntambah 4-5 harian kedepan',

{id:'RECOVERY',grup:'status',nama:'Recovery data (rujukan)',contoh:'kak budi',
teks:'Selamat {SALAM}, {SAPA}.\nKami dari *Teknisi Internasional Komputer Karanganyar* 😊🙏\n\nMohon maaf sebelumnya, {Sp}. Untuk kendala *Recovery Data / Pemulihan Data yang Hilang atau Rusak*, saat ini dari pihak kami belum bisa membantu proses pemulihannya secara langsung.\n\nNamun, sebagai alternatif, {PJ} bisa mencoba *konsultasi terlebih dahulu* dengan penyedia jasa khusus recovery data berikut:\n\n*1. DR. HARDISK Data Recovery — Yogyakarta*\n- *Alamat :* Depan MM UGM, Jl. Kaliurang KM 4,5, Kocoran, Caturtunggal, Depok, Sleman, DIY 55281.\n- *Google Maps :* _https://maps.app.goo.gl/f8prmRJD8cgs33RF8_\n- *WhatsApp :* 082268333337\n\n*2. Restu Comp — Jakarta Barat*\n- *Alamat :* Jl. Bojong Raya AE No. 50, RT.02/RW.04, Rawa Buaya, Cengkareng, Jakarta Barat 11740.\n- *Google Maps :* _https://maps.app.goo.gl/1wdRTdkv9NJwPKdM7_\n- *WhatsApp :* 081293696368\n\n*Catatan :*\n- Untuk *biaya, estimasi pengerjaan, dan kemungkinan data bisa diselamatkan*, silakan dikonsultasikan langsung dengan penyedia jasa tersebut.\n- Keberhasilan recovery data bergantung pada kondisi dan tingkat kerusakan media penyimpanan.\n- Sebaiknya hindari penggunaan atau penulisan data baru pada media penyimpanan yang bermasalah agar tidak memperbesar risiko data tertimpa.\n\nSemoga informasi ini bisa membantu dan ada solusi terbaik untuk menyelamatkan data {PJ} ya. 😊🙏\n\nTerima kasih.'},

{id:'DP_KEEP',grup:'info',nama:'Format DP keep barang',statis:1,
teks:'*Format DP Keep Barang / Sparepart*\n\n☘️ Nama :\n☘️ No. HP :\n☘️ Unit yang dipilih :\n    • Unit :\n    • Spesifikasi :\n    • Warna:\n\n✨ Transfer hanya ke rekening\n*BCA 3930845794* a.n. _*SIDIQ EKO PRASETYO*_ ✨\n\nSetelah melakukan transfer, mohon konfirmasi agar kami dapat segera melakukan pengecekan dan memastikan unit tersimpan 😊\n\n📍 *Alamat Toko :*\nJl. Lawu No. 367, Badranasri, Cangakan, Karanganyar\n_*https://maps.app.goo.gl/9CRAPBpfD64yRAKQ9*_\n\n⚠️ *Catatan :*\n- Uang DP yang sudah dibayarkan dan unit sudah diproses pemesanannya, _*tidak dapat dikembalikan apabila terjadi cancel order.*_ Mohon pengertiannya ya Kak 🙏\n\nJika barang sudah tersedia, kami akan segera hubungi 🙂🙏\nTerima kasih banyak atas kepercayaannya ❤️'},
{id:'JEMPUT',grup:'info',nama:'Form jemput service',statis:1,
teks:'Selamat {SALAM} Kak,\n\nTerima kasih telah memilih layanan kami. Kami akan segera mengagendakan pengambilan unit Anda untuk servis. Sebelum itu, kami mohon untuk mengisi form berikut agar proses penjadwalan dapat segera dilakukan:\n\n*Form Pengambilan Servis*\nNama Customer :\nNomor WA :\nSeri Laptop / Printer :\nKeluhan :\nLokasi / Shareloc :\n\n*Catatan :*\n- Free Ongkir untuk jemput servis dengan jarak maksimal 5 km dari lokasi Anda.\n- Untuk jemput dan antar kembali servis, akan dikenakan biaya tambahan mulai dari *_Rp 10.000_* tergantung jarak.\n\nKami tunggu formnya, dan setelah itu kami akan segera mengatur jadwal pengambilan unit Anda. Terima kasih atas perhatian dan kerjasamanya. 😊\n\nSalam hormat,\nTeknisi Internasional Komputer Karanganyar'},
{id:'NOMOR',grup:'info',nama:'Nomor operasional resmi',statis:1,
teks:'Halo Kak 👋\nBaik kak, pertanyaannya akan kami teruskan ke tim terkait terlebih dahulu ya.\n\nInformasi, berikut *nomor operasional resmi* kami :\n📞 CS Penjualan : *+62 812-3380-4077*\n🔧 CS Service : *+62 813-9079-2879*\n\nTerimakasih atas kepercayaannya 🙏\n\n*Internasional Komputer Karanganyar*'},
{id:'TUNAI',grup:'info',nama:'Tidak terima tunai',statis:1,
teks:'Mohon maaf ya, Kak. 🙏\n\nUntuk pembayaran secara cash/tunai di toko sudah tidak bisa kami terima sejak Februari 2025, karena saat ini seluruh transaksi menggunakan metode non-tunai (cashless).\n\nNamun, apabila Kakak hanya membawa uang tunai, bisa dibantu melakukan pembayaran melalui agen pembayaran di booth ijo es teh depan toko ya, Kak.\n\nTerima kasih atas pengertiannya, Kak 😊🙏'},
{id:'TT',grup:'info',nama:'TT / jual laptop',statis:1,
teks:'Selamat {SALAM}, Kak 😊\n\nBaik Kak, untuk pengecekan awal unitnya, boleh dibantu informasikan beberapa detail berikut ya :\n- *Seri lengkap laptop* :\n- *Spesifikasi laptop* : ( Processor, RAM, SSD/HDD, jika mengetahui )\n- *Kondisi laptop saat ini* : ( Normal atau ada kendala/kerusakan )\n\nJika belum mengetahui spesifikasinya, Kakak bisa mengirimkan foto laptop dan foto informasi spesifikasinya jika tersedia ya.\n\nNantinya informasi tersebut akan kami gunakan untuk pengecekan awal terkait estimasi harga jual atau nilai tukar tambah unitnya 😊🙏'},
{id:'PAYMENT_DULU',grup:'info',nama:'Payment dulu (tutup buku)',contoh:'tanggal Minggu, 30 Agustus 2026\njam 16.00',
teks:'*INFORMASI*\n\nApabila bisa dibantu untuk payment dahulu sebelum hari/tanggal _{TANGGAL}_ jam *{JAM|16.00}*, dikarenakan *Tutup Buku*\nJadi besok tinggal pengambilan unit saja.\n\nAtas perhatian dan partisipasinya, kami ucapkan terima kasih.\n\n*_Internasional Komputer Karanganyar_*'},
{id:'BUKA_MERAH',grup:'info',nama:'Toko buka tanggal merah',statis:1,
teks:'📌 *Info Jam Operasional Tanggal Merah*\n\nHalo Sobat Internasional Komputer 👋\nDiinformasikan untuk tanggal merah.\n\nToko kami tetap BUKA dengan jam operasional :\n⏰ *09.30 – 20.00 WIB*\n\n*Untuk Jam Istirahat :*\n- 11.30 - 12.45\n- 17.30 - 18.30\nSelama waktu istirahat *toko tutup*\n\nYuk tetap nyaman belanja & servis laptop tanpa khawatir libur 😉'},
{id:'TUTUP_LEBARAN',grup:'info',nama:'Toko tutup lebaran',contoh:'tutup Selasa, 17 Maret 2026 s/d Minggu, 22 Maret 2026\nbuka Senin, 23 Maret 2026\nambil Senin, 16 Maret 2026\njam 11.00',

{id:'WA_MAINT',grup:'info',nama:'WA maintenance',statis:1,
teks:'Hallo kak, mohon maaf dikarenakan Internasional Komputer baru saja maintenance WhatsApp di nomor utama, yang mengakibatkan beberapa history chat hilang semua, dimohon menginformasikan ulang ke kami jika kakaknya ada pesanan atau chat dari kami yang belum disiapkan atau kami balas ya kak 😊🙏\n\nUntuk hal ini akan kami coba untuk konfirmasi ulang menggunakan nomor operasional sementara.\n\nTerimakasih banyak, mohon maaf sebelumnya kak untuk kendala yang sedang terjadi 😊🙏'},

{id:'B1_KONDISI',grup:'komplain',nama:'1. Tanya kondisi unit',statis:1,
teks:'Selamat {SALAM} Kak 😊\nKami dari Internasional Komputer Karanganyar\n\nBagaimana kabarnya kak, semoga selalu dalam keadaan sehat ya kak 😊\n\nIzin disini kami ingin menanyakan terkait kondisi laptop kakak setelah dilakukan service kemarin.\n\nApakah sejauh ini sudah normal digunakan atau masih ada kendala yang dirasakan?\n\nMohon konfirmasinya ya kak, kami ingin memastikan unit yang sudah kami kerjakan benar-benar nyaman digunakan 🙏'},
{id:'B2_KLARIFIKASI',grup:'komplain',nama:'2. Klarifikasi ulasan',statis:1,
teks:'Baik kak, terima kasih atas informasinya 🙏\n\nTerkait kendala yang disampaikan, boleh dibantu dijelaskan lebih detail ya kak supaya kami bisa cek dan bantu tindak lanjuti dengan tepat.\n\nSelain itu, kami juga ingin konfirmasi secara baik-baik, apakah kakak sebelumnya sempat memberikan ulasan terkait kehilangan part di layanan kami?\n\nKami menanyakan hal ini bukan untuk menyudutkan, namun agar kami bisa menelusuri dan memastikan kejadian yang sebenarnya, serta melakukan evaluasi internal jika memang ada kekurangan dari kami.\n\nKami sangat terbuka untuk diskusi dan siap bertanggung jawab jika memang ada hal yang perlu kami perbaiki 🙏'},
{id:'B3_TENANG',grup:'komplain',nama:'3. Menenangkan',statis:1,
teks:'Baik kak, kami memahami kekhawatiran dan ketidaknyamanan yang kakak rasakan 🙏\n\nMohon maaf jika hal ini membuat kakak merasa kurang nyaman. Dari pihak kami sama sekali tidak ada niat untuk merugikan, dan kami sangat menjaga kepercayaan setiap customer.\n\nKami ingin membantu menyelesaikan hal ini dengan baik, jadi mohon dibantu informasikan detail kendalanya ya kak, supaya bisa kami tindak lanjuti dengan tepat 😊'},
{id:'B4_SOLUSI',grup:'komplain',nama:'4. Arahkan ke pembuktian',statis:1,
teks:'Baik kak 🙏\n\nAgar jelas dan tidak terjadi kesalahpahaman, kami siap bantu lakukan pengecekan ulang secara langsung pada unitnya.\n\nDari kami juga akan cek berdasarkan data service, dokumentasi, dan riwayat pengerjaan, supaya semuanya bisa jelas dan transparan.\n\nJika memang ada hal yang menjadi tanggung jawab kami, tentu akan kami selesaikan dengan baik.'},
{id:'B5_TEGAS',grup:'komplain',nama:'5. Tegas tapi sopan',statis:1,
teks:'Baik kak, kami memahami kekhawatiran yang disampaikan 🙏\n\nNamun untuk memastikan kebenarannya, kami perlu melakukan pengecekan berdasarkan data dan kondisi unit secara langsung, agar tidak terjadi kesimpulan yang kurang tepat.\n\nKami tetap terbuka untuk membantu dan menyelesaikan permasalahan ini secara baik-baik 😊'},
{id:'B6_CLOSING',grup:'komplain',nama:'6. Closing aman',statis:1,
teks:'Kami berharap permasalahan ini bisa diselesaikan dengan baik ya kak 🙏\n\nSilakan jika berkenan unitnya bisa dibawa kembali ke toko, nanti akan kami bantu cek dan tindak lanjuti sebaik mungkin.\n\nTerima kasih atas pengertiannya, dan kami tetap terbuka untuk komunikasi selanjutnya 😊'}

function semuaRiwayat(){
  var m={},o=[];DB.rows.forEach(function(r){m[r.fu_id]=1;o.push({id:r.fu_id,waktu:r.dibuat,fu:r.jenis_fu,sapaan:r.sapaan,nama:r.nama_customer,unit:r.unit,teknisi:r.teknisi,total:L.angkaSheet(r.total),status:r.status,sentAt:r.terkirim,teks:r.pesan_final,ketik:r.ketikan,sheet:true});});
  RIW.forEach(function(r){if(!m[String(r.id)])o.push(r);});
  o=o.filter(function(r){return !/^dihapus/i.test(r.status||'')&&!HAPUS[String(r.id)];});
  function ms(r){var d=tglObj(r.waktu);return d?d.getTime():0;}
  return o.sort(function(a,b){return ms(b)-ms(a);});
}
function tglObj(s){if(s instanceof Date)return s;s=String(s||'').replace(/^'/,'').trim();var m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})(?:[ ,]+(\d{1,2})[.:](\d{2})(?:[.:](\d{2}))?)?/);if(m)return new Date(+m[3],m[2]-1,+m[1],+(m[4]||0),+(m[5]||0),+(m[6]||0));var d=new Date(s);return isNaN(d)?null:d;}
function hariIni(d){var n=new Date();return d&&d.getFullYear()===n.getFullYear()&&d.getMonth()===n.getMonth()&&d.getDate()===n.getDate();}
var KONFIRMASI_FU=/^(KONF_SERV|BONGKAR|BATERAI|KEYBOARD|LAYAR|SSD|INUL|CLEANING|CLEANING_PENDEK|ENGSEL|ROMBONGAN|MAC|ANTRI|MOBO|MOBO_NYALA|MOBO_EXTEND|MOBO_INDEN|MOBO_LEMPAR|MOBO_KOMPLIKASI|MOBO_PROCI|GANTI_CARTRIDGE|POMPA_HEAD|ROLLER|PRINTER_SC|MONITOR|PROJECTOR|PART_INDEN|RETUR|SRV|LANJUTAN)$/;
function kunciUnit(r){return (String(r.nama||'')+'|'+String(r.unit||'')).toLowerCase();}
function garansiDari(r){
  var o=[],d=tglObj(r.waktu);if(!d||!r.teks)return o;
  String(r.teks).split('\n').forEach(function(ln){var m=ln.match(/^-\s*(.+?)\s*:.*\(\s*garansi\s+(\d+)\s*(hari|minggu|bulan|tahun)\s*\)/i);if(!m)return;
    var e=new Date(d),n=+m[2],u=m[3].toLowerCase();if(u==='hari')e.setDate(e.getDate()+n);else if(u==='minggu')e.setDate(e.getDate()+7*n);else if(u==='bulan')e.setMonth(e.getMonth()+n);else e.setFullYear(e.getFullYear()+n);
    o.push({item:m[1],gar:n+' '+u,habis:e,aktif:e>=new Date()});});
  return o;
}

    o+='<div class="hist"><div class="card-head"><div><b>'+esc((r.sapaan||'')+' '+(r.nama||'-'))+'</b> · '+esc(r.unit||'-')+'<div class="small muted">'+esc(namaFU(r.fu))+' · '+esc(r.teknisi||'')+' · '+(tglObj(r.waktu)?waktu(r.waktu):esc(r.waktu))+(r.sync===false?' · belum masuk sheet':'')+'</div></div><span class="pill '+st+'">'+esc(r.status||'-')+'</span></div>'+

      (r.ketik?'<button type="button" class="btn sm" data-act="riw-buka" data-id="'+esc(r.id)+'">Buka lagi</button>':'')+
      (!r.sheet?'<button type="button" class="btn sm ghost danger" data-act="riw-hapus" data-id="'+esc(r.id)+'">'+(UI.konfirm==='h'+r.id?'Yakin hapus?':'Hapus')+'</button>':'')+'</div></div>';});
  return o+'</div></section></div></div>';

function htmlGaransi(A){
  var q=String(UI.garq||'').trim().toLowerCase();if(q.length<2)return '<p class="empty">Ketik minimal 2 huruf.</p>';

  if(red){gambarJam(akhir,false);}else{(function step(ts){if(!t0)t0=ts;var k=Math.min(1,(ts-t0)/dur),e=1-Math.pow(1-k,3),hh=Math.round(h*e),mm=Math.round(m*e);

function b64Blob(b,m){var s=atob(b),a=new Uint8Array(s.length);for(var i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return new Blob([a],{type:m||'image/jpeg'});}
function tanyaClaude(arg){
  var mode=SISTEM[arg.mode]?arg.mode:'fubebas',ps=(arg.pesan||[]).slice(-16),gbr=[],akhir=ps[ps.length-1]||{};

  if(gbr.length&&!SMPIMG)return Promise.reject({message:'Pembacaan gambar belum diizinkan di tampilan ini. Hapus gambarnya atau buka dari link Claude.'});

  if(mode==='konsultasi')t+='MODE JAWABAN: '+(arg.jawab||'keduanya')+'\n\n';

  t+=(ps.length>1?'[TEKNISI, PERMINTAAN TERBARU]\n':'PERMINTAAN TEKNISI:\n')+String(akhir.teks||'').slice(0,6000);
  if(gbr.length)t+='\n\n('+gbr.length+' gambar terlampir, baca dengan teliti.)';
  t+=mode==='konsultasi'?'\n\nBalas HANYA satu objek JSON, tanpa penjelasan, tanpa blok kode.':'\n\nBalas HANYA teks pesan WhatsApp versi terbaru yang lengkap.';
  var o={modelTier:(gbr.length||mode==='konsultasi')?'default':'quick',cache:false};if(gbr.length)o.images=gbr.map(function(g){return b64Blob(g.data,g.mime);});
  return SMP(t,o).then(function(r){var x=String(r&&r.text||'').trim();if(!x)throw {message:'Jawaban kosong'};
    if(mode==='konsultasi'){var m=x.match(/\{[\s\S]*\}/);if(m)x=m[0];}
    return {teks:x,model:'Claude'+(o.modelTier==='quick'?' (cepat)':''),potong:!!(r&&r.truncated)};},
    function(e){var c=e&&e.code;throw {message:c==='not_granted'?'Izin memakai Claude belum diberikan. Tekan tombolnya lagi lalu setujui izinnya.':c==='rate_limited'?'Terlalu banyak permintaan. Tunggu sebentar lalu coba lagi.':(e&&e.message)||'Gagal menghubungi Claude'};});
}

  (function tik(){var b=$('#login-btn'),p=$('#login-pin'),er=$('#login-err');if(!b)return;var sisa=Math.ceil((UI.lkunci-Date.now())/1000);
    if(sisa<=0){UI.lkunci=0;b.disabled=false;p.disabled=false;b.textContent='Masuk';er.textContent='Silakan coba lagi.';p.value='';p.focus();return;}
    b.disabled=true;p.disabled=true;b.textContent='Terkunci '+sisa+' detik';er.textContent='PIN salah 3 kali. Tunggu '+sisa+' detik.';setTimeout(tik,250);})();

  b.disabled=true;b.textContent='Memeriksa...';
  var cek=GAS?gas('masuk',{kode:k,pin:pin}):sha256('ikk-fu|'+k+'|'+pin).then(function(h){if(h!==PIN_HASH[k])throw {message:'PIN salah.'};return {kode:k,token:'lokal',exp:Date.now()+30*864e5};});

    function(e){var msg=String(e&&e.message||'Gagal masuk').replace(/^\[auth\]\s*/,''),salah=/PIN salah/i.test(msg),m=/(\d+)\s*detik/.exec(msg);

function nilai(res){var p=res&&res.payload!==undefined?res.payload:res;if(typeof p==='string'){try{p=JSON.parse(p);}catch(e){}}
  if(p&&Array.isArray(p.values))return p.values;if(p&&p.content&&p.content.values)return p.content.values;
  if(res&&res.structuredContent&&Array.isArray(res.structuredContent.values))return res.structuredContent.values;
  if(res&&Array.isArray(res.content)){for(var i=0;i<res.content.length;i++){try{var j=JSON.parse(res.content[i].text);if(j&&Array.isArray(j.values))return j.values;}catch(e){}}}
  return null;}
function panggil(mcp,range,segar,ulang){
  var cache=segar?{refresh:true,staleTime:600000,gcTime:3600000}:{staleTime:600000,gcTime:3600000};
  return mcp.callTool('Google Spreadsheet','get_values',{spreadsheetId:CFG.sheetId,range:range},{cache:cache}).catch(function(e){
    if(e&&e.retryable&&!ulang)return new Promise(function(r){setTimeout(r,e.retryAfterMs||900+Math.random()*1200);}).then(function(){return panggil(mcp,range,segar,true);});throw e;});
}

  else if(a==='riw-tek'){UI.rtek=v;UI.rlim=25;render();}
  else if(a==='riw-lagi'){UI.rlim=(UI.rlim||25)+25;segarRiwayat();}
  else if(a==='cl-semua'){var dl=document.querySelector('#modal .cl-lama');if(dl){dl.open=true;dl.scrollIntoView({behavior:'smooth',block:'start'});}}
  else if(a==='cfg-reset'){if(UI.konfirm==='cfg'){CFG=gabungCfg({});store.set('ikk-cfg',CFG);UI.konfirm='';toast('Pengaturan dikembalikan');}else UI.konfirm='cfg';render();}
});
function bacaInput(el){var k=el.dataset.k,t=el.dataset.t,v;
  if(t==='bool')v=el.checked;else if(t==='rp')v=el.value.trim()===''?null:num(el.value);else if(t==='int')v=num(el.value);else v=el.value;setP(KS,k,v);}
document.addEventListener('input',function(ev){
  var el=ev.target;
  if(el.id==='fb-in'){FB.draft=el.value;store.set('ikk-fb',FB);return;}
  if(el.id==='fb-hasil'){FB.hasil=el.value;store.set('ikk-fb',FB);var w=$('#fb-wa');if(w)w.href=waHref(FB.wa,FB.hasil);var vv=$('#fb-v');if(vv)vv.innerHTML=periksaAI(FB.hasil).map(function(x){return '<li class="'+x.lvl+'">'+esc(x.msg)+'</li>';}).join('');return;}
  if(el.id==='fb-wa-no'){FB.wa=el.value;store.set('ikk-fb',FB);var w2=$('#fb-wa');if(w2)w2.href=waHref(FB.wa,FB.hasil);return;}
  if(el.id==='fb-q'){UI.fbq=el.value;$('#fb-riw').innerHTML=htmlRiwayatAI();return;}
  if(el.id==='ks-in'){KS2.teks=el.value;return;}
  if(el.id==='ketik'){K.teks=el.value;syncFU();simpanKetik();return;}
  if(el.id==='qk-cari'){QK.q=el.value;var hs=hasilCari();if(hs.length)QK.item=(/^X/.test(hs[0].id)?'X2':hs[0].id);simpanQK();$('#qk-list').innerHTML=htmlQKList();$('#qk-hasil').innerHTML=htmlQKHasil();return;}
  if(el.id==='qk-hpp'){QK.hpp=el.value;simpanQK();$('#qk-hasil').innerHTML=htmlQKHasil();return;}
  if(el.id==='wa-no'){K.wa=el.value;syncFU();simpanKetik();return;}
  if(el.id==='gar-q'){UI.garq=el.value;$('#gar-hasil').innerHTML=htmlGaransi();return;}
  if(el.id==='teks'){UI.manual=true;UI.teks=el.value;syncFU();return;}
  if(el.id==='cari-tarif'){UI.cari=el.value;$('#tarif-list').innerHTML=daftarTarif(UI.kat,UI.cari);return;}
  if(el.id==='tcari'){UI.tcari=el.value;$('#tarif-body').innerHTML=htmlTarifBody();return;}
  if(el.id==='mb-q'){UI.mb.q=el.value;$('#mb-hasil').innerHTML=htmlMBHasil();return;}
  if(el.id==='riw-q'){UI.filter=el.value;UI.rlim=25;segarRiwayat();return;}
  if(el.dataset.c){var c=el.dataset.c;if(c==='apiUrl'){CFG.apiUrl=el.value.trim();GAS=GASFRAME||!!apiUrl();store.set('ikk-cfg',CFG);return;}if(c==='bulat'){CFG.bulat=num(el.value);L.BULAT.n=CFG.bulat;store.set('ikk-cfg',CFG);return;}if(c==='teknisi'){var a=el.value.split('\n').map(function(x){var p=x.split('|');return {nama:(p[0]||'').trim(),kode:(p[1]||'').trim()};}).filter(function(x){return x.nama&&x.kode;});if(a.length)CFG.teknisi=a;if(!CFG.teknisi[CFG.teknisiUtama])CFG.teknisiUtama=0;}else CFG[c]=el.value;store.set('ikk-cfg',CFG);return;}
  if(!el.dataset.k||el.tagName==='SELECT'||el.type==='checkbox')return;
  bacaInput(el);syncK();
});
document.addEventListener('change',function(ev){
  var el=ev.target;
  if(el.id==='ks-file'){tambahGambar(el.files);el.value='';return;}
  if(el.id==='tek-utama'){CFG.teknisiUtama=parseInt(el.value,10)||0;store.set('ikk-cfg',CFG);syncFU();return;}
  if(!el.dataset.k)return;
  bacaInput(el);if(el.dataset.t==='rp'&&el.value.trim()!=='')el.value=L.titik(num(el.value));
  if(el.hasAttribute('data-r')){store.set('ikk-kalk',KS);nanti();}else syncK();
});
function rute(){var h=location.hash.replace('#','');UI.tab=TABS.indexOf(h)>=0?h:'buat-fu';UI.konfirm='';render(true);if(UI.tab==='kalkulator'&&UI.target)keMB();else window.scrollTo(0,0);}
window.addEventListener('hashchange',rute);
document.getElementById('tabs').addEventListener('click',function(e){var a=e.target.closest('a');if(a&&GASFRAME){e.preventDefault();ke(a.getAttribute('href').slice(1));}});
rute();
mulaiJam();gambarToggle();gambarWM();if(sesiOk())mulaiSesi();else bukaLogin('');
document.addEventListener('submit',function(e){if(e.target.id==='login-form'){e.preventDefault();prosesLogin();}
  if(e.target.id==='api-form'){e.preventDefault();var v=String($('#api-url').value||'').trim();if(!/^https:\/\/script\.google\.com\/.+\/exec(\?.*)?$/.test(v)){$('#api-err').textContent='Link harus diawali https://script.google.com/ dan berakhiran /exec';return;}
    CFG.apiUrl=v;store.set('ikk-cfg',CFG);location.reload();}});
window.addEventListener('online',function(){gambarOnline();toast('Online lagi');sinkronAntrian();});window.addEventListener('offline',function(){gambarOnline();toast('Offline: Buat FU dan Kalkulator tetap bisa dipakai');});
setInterval(sinkronAntrian,120000);
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&document.querySelector('.modal-wrap.on')){tutupModal();return;}if(e.target.id==='fb-in'&&e.key==='Enter'&&(e.ctrlKey||e.metaKey)){e.preventDefault();if(!UI.fbLoad)kirimFB();return;}if(e.target.id==='ks-in'&&e.key==='Enter'&&(e.ctrlKey||e.metaKey)){e.preventDefault();if(!KS2.loading)tanyaKS();return;}});
document.addEventListener('paste',function(e){if(UI.tab!=='konsultasi')return;var it=e.clipboardData&&e.clipboardData.files;if(it&&it.length){e.preventDefault();tambahGambar(it);}});
['dragenter','dragover'].forEach(function(n){document.addEventListener(n,function(e){var d=e.target.closest&&e.target.closest('#ks-drop');if(d){e.preventDefault();d.classList.add('over');}});});
['dragleave','drop'].forEach(function(n){document.addEventListener(n,function(e){var d=e.target.closest&&e.target.closest('#ks-drop');if(d){e.preventDefault();d.classList.remove('over');if(n==='drop')tambahGambar(e.dataTransfer.files);}});});
document.addEventListener('keydown',function(e){if(e.target.id==='qk-cari'&&e.key==='Enter'){e.preventDefault();var hp=$('#qk-hpp');if(hp)hp.focus();}});document.addEventListener('toggle',function(e){if(e.target.classList&&e.target.classList.contains('multi'))UI.multi=e.target.open;},true);
})();
</script>
</body>
